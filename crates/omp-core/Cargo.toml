[package]
name = "omp-core"
version = "0.9.5"
edition = "2024"
license = "MIT"
description = "Portable OMP workspace rules and operating environment adapters"

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
notify = "=8.2.1"
similar = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
sha2 = "0.10"
yaml-edit = "0.3.5"
serde_yaml_ng = "0.10"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
sonic-rs = "0.5.10"
simd-json = { version = "0.19.0", features = ["big-int-as-float"] }
memchr = "2"
rkyv = { version = "=0.8.18", features = ["unaligned", "little_endian", "pointer_width_32"] }
crossbeam-channel = "0.5.17"
serde_bytes = "0.11.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

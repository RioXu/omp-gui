[package]
name = "omp-gui"
version = "0.9.0"
edition = "2024"
description = "A native Windows workspace for Oh My Pi"
license = "MIT"

[workspace]
members = ["crates/omp-core", "crates/omp-remote"]
default-members = [".", "crates/omp-core"]
resolver = "3"

[features]
frame-profile = ["gpui-kit/profiler"]
# Experimental backend, opt in explicitly for native A/B measurements.
gpui-fast = ["gpui-kit/gpui-fast"]

[dependencies]
omp-core = { path = "crates/omp-core" }
gpui-kit = { version = "=0.8.1", features = ["syntect"] }
markdown = "=1.0.0"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
ropey = "=2.0.0-beta.1"
base64 = "0.22"
sha2 = "0.10"
tar = "0.4"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
omp-core = { path = "crates/omp-core", features = ["test-support"] }
# Keep pointer-event tests on whichever backend the Kit facade selects.
gpui-kit = { version = "=0.8.1", features = ["test-support"] }

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
debug = 0
incremental = true
opt-level = 1

# Native layout/text/scene processing runs every animation frame. Keep the
# development UI responsive too, rather than benchmarking unoptimized GPUI.
[profile.dev.package."*"]
opt-level = 2

# Unit tests use a simulated frame clock; keep their compile cycle inexpensive.
# Measure animation performance with the optimized native application instead.
[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 0

[profile.release]
strip = true
lto = false

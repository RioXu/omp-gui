name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p omp-core -p omp-gui-remote --all-targets -- -D warnings
      # Isolate native process leases from concurrent child-process tests.
      - run: cargo test --locked -p omp-core -p omp-gui-remote -- --test-threads=1
        env:
          RUST_MIN_STACK: 8388608
      - run: cargo build --locked --release -p omp-gui-remote
      - name: Stage Linux service and source metadata
        run: |
          mkdir -p artifacts/linux-server
          cp target/release/omp-gui-remote artifacts/linux-server/
          printf '%s\n' "$GITHUB_SHA" > artifacts/linux-server/commit.txt
          target/release/omp-gui-remote --version > artifacts/linux-server/version.txt
          ldd --version > artifacts/linux-server/platform.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server-x86_64
          path: artifacts/linux-server/
          if-no-files-found: error

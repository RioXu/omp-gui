name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Cargo.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Cargo.toml version missing' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match Cargo.toml' }
            $publish = 'true'
          } else {
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            if ($LASTEXITCODE -notin @(0, 2)) { throw 'Could not check existing release tag' }
            $publish = if ($LASTEXITCODE -eq 2) { 'true' } else { 'false' }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0
  linux:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p omp-core -p omp-gui-remote --all-targets -- -D warnings
      # Isolate native process leases from concurrent child-process tests.
      - run: cargo test --locked -p omp-core -p omp-gui-remote -- --test-threads=1
      - run: cargo build --locked --release -p omp-gui-remote
      - run: target/release/omp-gui-remote --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: target/release/omp-gui-remote
          if-no-files-found: error

  windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check tag and version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo.toml' }
          foreach ($manifest in @('crates/omp-core/Cargo.toml', 'crates/omp-remote/Cargo.toml')) {
            $member = [regex]::Match((Get-Content $manifest -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
            if ($member -ne $version) { throw "Version mismatch: $manifest" }
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked --release -p omp-gui
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: target/release/omp-gui.exe
          if-no-files-found: error

  publish:
    needs: [prepare, linux, windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/release-binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts/release-remote
      - name: Package
        shell: pwsh
        run: |
          $compiler = ./scripts/install-inno.ps1
          ./scripts/package-release.ps1 -Binary artifacts/release-binaries/omp-gui.exe -RemoteRoot artifacts/release-remote -InnoCompiler $compiler
      - name: Verify install, upgrade and uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem artifacts/release/*-setup.exe).FullName
          ./scripts/verify-installer.ps1 -Installer $installer -Binary artifacts/release-binaries/omp-gui.exe -RemoteBinary artifacts/release-remote/linux-x86_64/omp-gui-remote
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.prepare.outputs.tag }}'
          $installer = (Get-ChildItem artifacts/release/*-setup.exe).FullName
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OMP GUI $tag" --notes-file "docs/releases/$tag.md" $installer artifacts/release/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

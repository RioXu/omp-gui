name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p omp-core -p omp-gui-remote --all-targets -- -D warnings
      # Isolate native process leases from concurrent child-process tests.
      - run: cargo test --locked -p omp-core -p omp-gui-remote -- --test-threads=1
      - run: cargo build --locked --release -p omp-gui-remote
      - run: target/release/omp-gui-remote --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: target/release/omp-gui-remote
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check tag and version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo.toml' }
          foreach ($manifest in @('crates/omp-core/Cargo.toml', 'crates/omp-remote/Cargo.toml')) {
            $member = [regex]::Match((Get-Content $manifest -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
            if ($member -ne $version) { throw "Version mismatch: $manifest" }
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked --release -p omp-gui
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: target/release/omp-gui.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/release-binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts/release-remote
      - name: Package
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -Binary artifacts/release-binaries/omp-gui.exe -RemoteRoot artifacts/release-remote
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = @(Get-ChildItem artifacts/release/*.zip | ForEach-Object FullName)
          gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "OMP GUI $tag" --notes-file "docs/releases/$tag.md" @archive artifacts/release/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
